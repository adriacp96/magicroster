<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Roster</title>
  <style>
    body {
      background-color: #000000;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .button-container {
      position: relative;
      display: inline-block;
    }

    .button-container::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 120%;
      height: 150%;
      background: #3b82f6;
      filter: blur(35px);
      opacity: 0.8;
      border-radius: 50px;
      z-index: 0;
      animation: pulse 2s infinite alternate ease-in-out;
    }

    .magic-button {
      position: relative;
      z-index: 1;
      display: inline-block;
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 1.5rem;
      font-weight: bold;
      text-decoration: none;
      padding: 16px 40px;
      border-radius: 50px;
      border: 1px solid rgba(59, 130, 246, 0.5);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
      user-select: none;
      -webkit-user-drag: element;
      cursor: grab;
    }
    
    .magic-button:active {
      cursor: grabbing;
    }

    @keyframes pulse {
      0% { filter: blur(25px); opacity: 0.6; transform: translate(-50%, -50%) scale(0.95); }
      100% { filter: blur(45px); opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    }

    @media (max-width: 600px) {
      .magic-button {
        font-size: 1.2rem;
        padding: 14px 32px;
      }
    }
  </style>
</head>
<body>

  <div class="button-container">
    <a href="javascript:(function(){const mainContainer=document.querySelector('#PrintRosterDiv-ModalBody');if(!mainContainer){alert('Error: Could not find the roster container on this page.');return;}const cloned=mainContainer.cloneNode(true);const svg=cloned.querySelector('#SVGContainer');if(svg)svg.remove();const styles=cloned.querySelectorAll('style');styles.forEach(s=>s.remove());const rawText=cloned.innerText.split('\n').filter(l=>l.trim()!=='').join('\n');const overlay=document.createElement('div');overlay.id='rostercal-magic-overlay';overlay.style.cssText='position:fixed;inset:0;background:rgba(3,7,18,0.85);backdrop-filter:blur(10px);z-index:999998;display:flex;align-items:center;justify-content:center;transition:opacity 0.3s;';const iframe=document.createElement('iframe');iframe.src='https://adriacp96.github.io/rostercal/?magic=true';iframe.style.cssText='width:95vw;height:90vh;max-width:1200px;border:1px solid rgba(51,65,85,0.6);border-radius:24px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);background:#030712;z-index:999999;';const close=document.createElement('button');close.innerHTML='✕ Close';close.style.cssText='position:absolute;top:20px;right:5vw;background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#fff;font-size:14px;font-weight:bold;padding:8px 16px;border-radius:20px;cursor:pointer;z-index:1000000;backdrop-filter:blur(5px);';close.onclick=()=>overlay.remove();overlay.appendChild(iframe);overlay.appendChild(close);document.body.appendChild(overlay);iframe.onload=()=>{iframe.contentWindow.postMessage({type:'ROSTER_DATA',text:rawText},'*');};})();" class="magic-button">Magic Roster</a>
  </div>

</body>
</html>
